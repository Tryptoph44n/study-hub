<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- background -->
  <rect width="512" height="512" rx="104" fill="#f3ead2"/>
  <!-- twinkles -->
  <g fill="#c9a227">
    <circle cx="70" cy="120" r="4"/><circle cx="445" cy="150" r="5"/><circle cx="430" cy="300" r="4"/>
    <circle cx="92" cy="300" r="3"/><circle cx="120" cy="420" r="4"/><circle cx="400" cy="420" r="3"/>
  </g>

  <!-- starry cape behind -->
  <path d="M150 330 Q256 300 362 330 L392 470 Q256 440 120 470 Z" fill="#2438a8"/>
  <g fill="#f2c230">
    <polygon points="186,372 192,388 209,388 195,398 200,415 186,405 172,415 177,398 163,388 180,388"/>
    <polygon points="326,372 332,388 349,388 335,398 340,415 326,405 312,415 317,398 303,388 320,388"/>
    <path d="M250 420 a18 18 0 1 0 18 -2 a13 13 0 1 1 -18 2z" />
  </g>

  <!-- ears -->
  <path d="M150 232 q-16 -40 6 -66 q26 8 34 40 z" fill="#f3961d"/>
  <path d="M362 232 q16 -40 -6 -66 q-26 8 -34 40 z" fill="#f3961d"/>
  <path d="M156 222 q-8 -26 6 -44 q16 8 20 30 z" fill="#7a4a12" opacity="0.55"/>
  <path d="M356 222 q8 -26 -6 -44 q-16 8 -20 30 z" fill="#7a4a12" opacity="0.55"/>

  <!-- head -->
  <ellipse cx="256" cy="300" rx="118" ry="100" fill="#f3961d"/>
  <!-- muzzle -->
  <ellipse cx="256" cy="338" rx="92" ry="62" fill="#fbe3b3"/>

  <!-- eyes (Garfield half-lidded) -->
  <ellipse cx="216" cy="276" rx="30" ry="34" fill="#fff"/>
  <ellipse cx="296" cy="276" rx="30" ry="34" fill="#fff"/>
  <circle cx="220" cy="282" r="11" fill="#1a1a1a"/>
  <circle cx="292" cy="282" r="11" fill="#1a1a1a"/>
  <path d="M186 268 q30 -16 60 0" fill="none" stroke="#7a4a12" stroke-width="7" stroke-linecap="round"/>
  <path d="M266 268 q30 -16 60 0" fill="none" stroke="#7a4a12" stroke-width="7" stroke-linecap="round"/>

  <!-- nose + grin -->
  <ellipse cx="256" cy="318" rx="12" ry="9" fill="#9c3a2a"/>
  <path d="M256 327 q-46 40 -86 14 M256 327 q46 40 86 14" fill="none" stroke="#7a4a12" stroke-width="8" stroke-linecap="round"/>
  <path d="M214 352 q42 22 84 0 q-8 22 -42 22 q-34 0 -42 -22z" fill="#fff" stroke="#7a4a12" stroke-width="4"/>

  <!-- whiskers -->
  <g stroke="#7a4a12" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <path d="M150 330 q-34 -4 -54 -14" fill="none"/><path d="M150 350 q-34 6 -56 6" fill="none"/>
    <path d="M362 330 q34 -4 54 -14" fill="none"/><path d="M362 350 q34 6 56 6" fill="none"/>
  </g>

  <!-- wizard hat (tilted) -->
  <g transform="rotate(-16 256 150)">
    <path d="M256 18 C238 92 196 150 170 188 L342 188 C316 150 274 92 256 18 Z" fill="#2438a8"/>
    <path d="M256 20 C272 60 300 70 320 56" fill="none" stroke="#2438a8" stroke-width="26" stroke-linecap="round"/>
    <circle cx="324" cy="52" r="17" fill="#2438a8"/>
    <ellipse cx="256" cy="196" rx="104" ry="20" fill="#2438a8"/>
    <g fill="#f2c230">
      <polygon points="240,96 246,112 263,112 249,122 254,139 240,129 226,139 231,122 217,112 234,112"/>
      <polygon points="292,70 297,82 311,82 300,90 304,103 292,95 280,103 284,90 273,82 287,82"/>
      <path d="M214 150 a15 15 0 1 0 15 -2 a11 11 0 1 1 -15 2z"/>
      <circle cx="300" cy="150" r="6"/>
    </g>
  </g>
</svg>
